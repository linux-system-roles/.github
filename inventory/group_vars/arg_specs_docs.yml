present_arg_specs_docs_files: []
present_arg_specs_docs_templates:
  - .github/workflows/check-docs-updated.yml
  # Publishes the committed README.html to the docs branch (GitHub Pages).
  # Replaces build_docs.yml's publish step, which is removed below: these roles
  # already have a rendered README.html, so there is nothing for pandoc to do.
  - .github/workflows/publish_docs.yml
# Files that are installed for all active_roles but are not wanted for roles that
# build docs from argument_specs: the old pandoc README->HTML workflow (both its
# conversion and its publish step) and its template. These are removed from the
# role and subtracted from the present lists so the active_roles defaults do not
# re-add them.
absent_arg_specs_docs_files:
  - .github/workflows/build_docs.yml
  - .github/workflows/test_converting_readme.yml
  - .pandoc_template.html5
