github_org: linux-system-roles
github_url_prefix: "git@github.com:"
default_ansible_lint:
  skip_list:
    - fqcn-builtins
    - var-naming[no-role-prefix]
  warn_list: []
  exclude_paths:
    - tests/roles/
    - .github/
    - .markdownlint.yaml
    - examples/roles/
    - .collection/
  mock_roles:
    - linux-system-roles.{{ inventory_hostname }}
lsr_namespace: fedora
lsr_name: linux_system_roles
lsr_role_namespace: linux_system_roles  # for ansible-lint
gha_checkout_action: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
tox_lsr_url: "git+https://github.com/linux-system-roles/tox-lsr@d594be24ed56e586a5796720d51c261e40c20496"  # 3.20.1
# These are the supported RHEL-alike distros - note that at the time of writing,
# OracleLinux has some problems with some roles, so we don't include it here
# Roles that do support OracleLinux can list it in lsr_rh_distros_extra
lsr_rh_distros: "{{ ['AlmaLinux', 'CentOS', 'RedHat', 'Rocky'] + lsr_rh_distros_extra | d([]) }}"
# The ansible.posix and community.general versions are intentionally left
# unconstrained so that all roles track the latest releases. EL7 compatibility
# is preserved by vendoring EL7-compatible modules into the roles that support
# EL7 managed nodes (and by tft-tests skipping collection installation when
# running on ansible 2.9), so the previous caps (ansible.posix <2.2.0,
# community.general <12.0.0) are no longer needed. If a role ever needs to pin a
# version, it can add a version to the entry in the role's host_vars file.
