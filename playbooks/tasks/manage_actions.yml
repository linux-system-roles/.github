# Generated by Codex using model Sol medium 6.
- name: Manage organization GitHub Actions permissions
  when:
    - manage_actions_phase == 'setup'
    - not (lsr_dry_run | d(true) | bool)
  vars:
    # The selected policy also allows actions owned by github_org.
    update_files_base_allowed_action_patterns:
      - codecov/codecov-action@*
      - codespell-project/actions-codespell@*
      - Jakuje/check-ansible-action@*
      - sclorg/testing-farm-as-github-action@*
    update_files_allowed_action_patterns: >-
      {{ update_files_base_allowed_action_patterns
         + ([gh_action_prefix ~ '/*@*']
            if (gh_action_prefix.split('/')[0] | lower) != (github_org | lower)
            else []) }}
  block:
    - name: Get organization GitHub Actions permissions
      command:
        argv:
          - gh
          - api
          - "orgs/{{ github_org }}/actions/permissions"
      register: org_actions_permissions
      changed_when: false

    - name: Allow selected actions and require SHA pinning
      command:
        argv:
          - gh
          - api
          - --method
          - PUT
          - "orgs/{{ github_org }}/actions/permissions"
          - --input
          - '-'
        # Repos with .github/workflows/actions.lock satisfy SHA pinning through locked commits.
        stdin: >-
          {{ {
            'enabled_repositories': (org_actions_permissions.stdout | from_json).enabled_repositories,
            'allowed_actions': 'selected',
            'sha_pinning_required': true
          } | to_json }}
        stdin_add_newline: false
      when: >-
        (org_actions_permissions.stdout | from_json).allowed_actions != 'selected'
        or not ((org_actions_permissions.stdout | from_json).sha_pinning_required | d(false) | bool)

    - name: Get selected organization actions
      command:
        argv:
          - gh
          - api
          - "orgs/{{ github_org }}/actions/permissions/selected-actions"
      register: org_selected_actions
      changed_when: false

    - name: Allow GitHub actions and specified external actions
      command:
        argv:
          - gh
          - api
          - --method
          - PUT
          - "orgs/{{ github_org }}/actions/permissions/selected-actions"
          - --input
          - '-'
        stdin: >-
          {{ {
            'github_owned_allowed': true,
            'verified_allowed': false,
            'patterns_allowed': update_files_allowed_action_patterns
          } | to_json }}
        stdin_add_newline: false
      when: >-
        not ((org_selected_actions.stdout | from_json).github_owned_allowed | bool)
        or ((org_selected_actions.stdout | from_json).verified_allowed | bool)
        or ((org_selected_actions.stdout | from_json).patterns_allowed | d([]) | sort)
           != (update_files_allowed_action_patterns | sort)

- name: Ensure gh actions-lock extension is installed
  shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      if ! gh extension list | awk -F '\t' '$2 == "github/gh-actions-lock" { found=1 } END { exit !found }'; then
        gh extension install github/gh-actions-lock
      fi
  changed_when: false
  run_once: true
  when: manage_actions_phase == 'setup'

# Run this after updating all files in the role's .github/workflows directory.
- name: Manage GitHub Actions lockfile
  shell:
    chdir: "{{ git_dir }}"
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      gh actions-lock --no-interactive --accept-moved
      git add -- .github/workflows/actions.lock .github/workflows/*.yml
  changed_when: false
  when: manage_actions_phase == 'lockfile'
