# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration for linux-system-roles
# Based on conventions from https://linux-system-roles.github.io/contribute.html
# This file is managed from https://github.com/linux-system-roles/.github,
# any manual edits will be overwritten.
---
chat:
  art: false
  allow_non_org_members: false

reviews:
  auto_review:
    enabled: false  # to conserve resources, reviews are done manually

  # Disable fun features
  poem: false
  in_progress_fortune: false

  # Disable auto-features
  auto_apply_labels: false
  auto_assign_reviewers: false
  request_changes_workflow: false

  # Disable additional review features
  sequence_diagrams: false
  estimate_code_review_effort: false
  suggested_labels: false
  high_level_summary_in_walkthrough: false

  # Disable finishing touches
  finishing_touches:
    unit_tests:
      enabled: false

# PR title/description requirements, AI agent attribution, and all
# path-specific coding instructions (tasks/**/*.yml, defaults/**/*.yml,
# meta/argument_specs.yml, README.md, etc.) now live in AGENTS.md at the
# repo root. CodeRabbit auto-discovers AGENTS.md and applies it as review
# criteria without any further configuration here - see
# https://docs.coderabbit.ai/knowledge-base/code-guidelines
#
# Note: unlike the old `pre_merge_checks`, this is advisory, not a hard
# gate. The Conventional Commits PR title format is still independently
# enforced by the .github/workflows/pr-title-lint.yml action in every role
# repo; there is currently no independent enforcement of the PR
# description format or AI-attribution comment described in AGENTS.md.
