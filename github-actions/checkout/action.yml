# Generated by Codex using model Sol medium 6.
name: Checkout with git and gh
description: Checkout with git and gh
inputs:
  repository:
    description: repository
    required: false
    default: ''
  ref:
    description: ref
    required: false
    default: ''
  path:
    description: path
    required: false
    default: .
  fetch-depth:
    description: fetch depth
    required: false
    default: '1'
  persist-credentials:
    description: persist credentials
    required: false
    default: 'true'
  sparse-checkout:
    description: sparse checkout
    required: false
    default: ''
  sparse-checkout-cone-mode:
    description: sparse checkout cone mode
    required: false
    default: 'true'
  github-token:
    description: github token
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
  - shell: bash
    env:
      GH_TOKEN: ${{ inputs.github-token }}
      INPUT_REPOSITORY: ${{ inputs.repository }}
      INPUT_REF: ${{ inputs.ref }}
      INPUT_PATH: ${{ inputs.path }}
      INPUT_FETCH_DEPTH: ${{ inputs.fetch-depth }}
      INPUT_PERSIST_CREDENTIALS: ${{ inputs.persist-credentials }}
      INPUT_SPARSE_CHECKOUT: ${{ inputs.sparse-checkout }}
      INPUT_SPARSE_CONE_MODE: ${{ inputs.sparse-checkout-cone-mode }}
    run: |
      set -euo pipefail
      repo="${INPUT_REPOSITORY:-$GITHUB_REPOSITORY}"
      ref="$INPUT_REF"
      dest="${INPUT_PATH:-.}"
      depth=()
      if [ "$INPUT_FETCH_DEPTH" != 0 ]; then depth=(--depth "$INPUT_FETCH_DEPTH"); fi
      gh auth setup-git
      if [ ! -d "$dest/.git" ]; then
        gh repo clone "$repo" "$dest" -- --no-checkout "${depth[@]}"
      fi
      if [ -z "$ref" ]; then
        if [ "$repo" = "$GITHUB_REPOSITORY" ]; then
          ref="$GITHUB_SHA"
        else
          ref=$(git -C "$dest" symbolic-ref refs/remotes/origin/HEAD || true)
          ref="${ref#refs/remotes/origin/}"
          if [ -z "$ref" ]; then
            default_branch=$(gh repo view "$repo" --json defaultBranchRef --jq .defaultBranchRef.name)
            ref="$default_branch"
          fi
        fi
      fi
      git -C "$dest" fetch "${depth[@]}" origin "$ref"
      if [ -n "$INPUT_SPARSE_CHECKOUT" ]; then
        if [ "$INPUT_SPARSE_CONE_MODE" = true ]; then
          git -C "$dest" sparse-checkout init --cone
        else
          git -C "$dest" sparse-checkout init --no-cone
        fi
        printf '%s\n' "$INPUT_SPARSE_CHECKOUT" | git -C "$dest" sparse-checkout set --stdin
      fi
      git -C "$dest" checkout --force FETCH_HEAD
      if [ "$INPUT_PERSIST_CREDENTIALS" = true ]; then
        encoded=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
        git -C "$dest" config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $encoded"
      fi
