# Generated by Codex using model Sol medium 6.
name: Run ShellCheck on shell scripts
description: Run ShellCheck on shell scripts
inputs: {}
outputs:
  files:
    description: Files checked by ShellCheck
    value: ${{ steps.main.outputs.files }}
runs:
  using: composite
  steps:
  - shell: bash
    run: |
      set -euo pipefail
      sudo apt-get update
      sudo apt-get install -y shellcheck
      mapfile -d '' files < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
      {
        printf 'files<<EOF\n'
        printf '%s\n' "${files[@]}"
        printf 'EOF\n'
      } >> "$GITHUB_OUTPUT"
      if [ "${files[0]-}" != "" ]; then
        shellcheck ${SHELLCHECK_OPTS:-} "${files[@]}"
      fi
    id: main
