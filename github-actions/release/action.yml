name: Create a GitHub release with gh
description: Create a GitHub release with gh
inputs:
  tag:
    description: tag
    required: false
    default: ''
  name:
    description: name
    required: false
    default: ''
  bodyFile:
    description: bodyFile
    required: false
    default: ''
  makeLatest:
    description: makeLatest
    required: false
    default: 'false'
  github-token:
    description: github token
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
  - shell: bash
    env:
      GH_TOKEN: ${{ inputs.github-token }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_NAME: ${{ inputs.name }}
      INPUT_BODY_FILE: ${{ inputs.bodyFile }}
      INPUT_MAKE_LATEST: ${{ inputs.makeLatest }}
    run: |
      set -euo pipefail
      args=(--verify-tag --title "$INPUT_NAME")
      if [ -n "$INPUT_BODY_FILE" ]; then args+=(--notes-file "$INPUT_BODY_FILE"); fi
      if [ "$INPUT_MAKE_LATEST" = true ]; then
        args+=(--latest)
      else
        args+=(--latest=false)
      fi
      gh release create "$INPUT_TAG" "${args[@]}"
