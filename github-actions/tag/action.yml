name: Create and push a Git tag
description: Create and push a Git tag
inputs:
  github_token:
    description: github_token
    required: false
    default: ${{ github.token }}
  custom_tag:
    description: custom_tag
    required: false
    default: ''
  tag_prefix:
    description: tag_prefix
    required: false
    default: ''
  directory:
    description: directory
    required: false
    default: .
runs:
  using: composite
  steps:
  - shell: bash
    env:
      GH_TOKEN: ${{ inputs.github_token }}
      INPUT_TAG: ${{ inputs.custom_tag }}
      INPUT_PREFIX: ${{ inputs.tag_prefix }}
      INPUT_DIRECTORY: ${{ inputs.directory }}
    run: |
      set -euo pipefail
      # Clear any local authorization header before gh configures this step's token.
      git -C "$INPUT_DIRECTORY" config --local --unset-all http.https://github.com/.extraheader || [ "$?" -eq 5 ]
      gh auth setup-git
      git -C "$INPUT_DIRECTORY" config user.name 'github-actions[bot]'
      git -C "$INPUT_DIRECTORY" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      tag="${INPUT_PREFIX}${INPUT_TAG}"
      git -C "$INPUT_DIRECTORY" tag "$tag"
      git -C "$INPUT_DIRECTORY" push origin "refs/tags/$tag"
