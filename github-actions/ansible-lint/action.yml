name: Run ansible-lint
description: Install the requested Ansible dependencies and lint targets
inputs:
  targets:
    description: Newline-separated paths to lint
    default: ./
  override-deps:
    description: Newline-separated Python package requirements
    default: ansible-lint
runs:
  using: composite
  steps:
  - shell: bash
    env:
      INPUT_TARGETS: ${{ inputs.targets }}
      INPUT_DEPS: ${{ inputs.override-deps }}
    run: |
      set -euo pipefail
      venv="${RUNNER_TEMP:-/tmp}/lsr-ansible-lint"
      python3 -m venv "$venv"
      mapfile -t deps < <(printf '%s\n' "$INPUT_DEPS" | sed '/^[[:space:]]*$/d')
      "$venv/bin/pip" install "${deps[@]}"
      mapfile -t targets < <(printf '%s\n' "$INPUT_TARGETS" | sed '/^[[:space:]]*$/d')
      "$venv/bin/ansible-lint" "${targets[@]}"
