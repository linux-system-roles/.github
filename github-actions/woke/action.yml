name: Run woke language checks
description: Run woke language checks
inputs:
  woke-args:
    description: woke args
    required: false
    default: .
  fail-on-error:
    description: fail on error
    required: false
    default: 'false'
  woke-version:
    description: woke version
    required: false
    default: 6b1dc811643939a5b786f1f16bfaf7d717384e5b
runs:
  using: composite
  steps:
  - shell: bash
    env:
      INPUT_WOKE_ARGS: ${{ inputs.woke-args }}
      INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      INPUT_WOKE_VERSION: ${{ inputs.woke-version }}
    run: |
      set -euo pipefail
      case "$INPUT_WOKE_VERSION" in *[!a-zA-Z0-9.]*|'') echo 'Invalid woke version' >&2; exit 1;; esac
      curl --fail --location --silent --show-error \
        "https://raw.githubusercontent.com/linux-system-roles/lsr-woke-action/$INPUT_WOKE_VERSION/woke" \
        --output "$RUNNER_TEMP/woke"
      chmod +x "$RUNNER_TEMP/woke"
      read -r -a args <<< "$INPUT_WOKE_ARGS"
      "$RUNNER_TEMP/woke" --output github-actions \
        "--exit-1-on-failure=$INPUT_FAIL_ON_ERROR" "${args[@]}"
