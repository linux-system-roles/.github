name: Install Podman on Linux
description: Install Podman on Linux
inputs:
  start-service:
    description: start service
    required: false
    default: 'false'
runs:
  using: composite
  steps:
  - shell: bash
    env:
      INPUT_START_SERVICE: ${{ inputs.start-service }}
    run: |
      set -euo pipefail
      sudo apt-get update
      sudo apt-get install -y podman crun skopeo
      podman --version
      if [ "$INPUT_START_SERVICE" = true ]; then systemctl --user start podman.socket; fi
