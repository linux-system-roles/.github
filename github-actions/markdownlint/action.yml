name: Lint Markdown in a container
description: Lint Markdown in a container
inputs:
  args:
    description: args
    required: false
    default: ''
  config:
    description: config
    required: false
    default: .markdownlint.yaml
  image:
    description: image
    required: false
    default: avtodev/markdown-lint@sha256:040db72e30eae54299c0b8f87dfe24dadaf2d9a36c037408f5c9686cab0e105d
runs:
  using: composite
  steps:
  - shell: bash
    env:
      INPUT_ARGS: ${{ inputs.args }}
      INPUT_CONFIG: ${{ inputs.config }}
      INPUT_IMAGE: ${{ inputs.image }}
    run: |
      set -euo pipefail
      shopt -s globstar nullglob
      read -r -a args <<< "$INPUT_ARGS"
      targets=()
      options=()
      for arg in "${args[@]}"; do
        case "$arg" in
          --*) options+=("$arg") ;;
          *\**)
            matched=false
            while IFS= read -r match; do
              targets+=("$match")
              matched=true
            done < <(compgen -G "$arg")
            if [ "$matched" = false ]; then
              printf 'No Markdown targets match %s\n' "$arg" >&2
              exit 1
            fi
            ;;
          *) targets+=("$arg") ;;
        esac
      done
      if [ "${#targets[@]}" -eq 0 ]; then targets=(.); fi
      docker run --rm --volume "$PWD:/work" --workdir /work \
        --env "INPUT_CONFIG=$INPUT_CONFIG" "$INPUT_IMAGE" "${options[@]}" "${targets[@]}"
