name: Lint Markdown in a container
description: Lint Markdown in a container
inputs:
  args:
    description: args
    required: false
    default: ''
  config:
    description: config
    required: false
    default: .markdownlint.yaml
  image:
    description: image
    required: false
    default: avtodev/markdown-lint:master
runs:
  using: composite
  steps:
  - shell: bash
    env:
      INPUT_ARGS: ${{ inputs.args }}
      INPUT_CONFIG: ${{ inputs.config }}
      INPUT_IMAGE: ${{ inputs.image }}
    run: |
      set -euo pipefail
      shopt -s globstar nullglob
      read -r -a args <<< "$INPUT_ARGS"
      files=()
      options=()
      for arg in "${args[@]}"; do
        case "$arg" in
          --*) options+=("$arg") ;;
          *\**) while IFS= read -r match; do files+=("$match"); done < <(compgen -G "$arg" || true) ;;
          *.md) files+=("$arg") ;;
          *) options+=("$arg") ;;
        esac
      done
      if [ "${files[0]-}" = "" ]; then exit 0; fi
      docker run --rm --volume "$PWD:/work" --workdir /work \
        --env "INPUT_CONFIG=$INPUT_CONFIG" "$INPUT_IMAGE" "${options[@]}" "${files[@]}"
