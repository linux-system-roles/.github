name: Create or comment on a periodic CI pull request
description: Create or comment on a periodic CI pull request
inputs:
  github-token:
    description: github token
    required: false
    default: ${{ github.token }}
  branch:
    description: branch
    required: false
    default: ''
  base:
    description: base
    required: false
    default: ''
  title:
    description: title
    required: false
    default: ''
  body:
    description: body
    required: false
    default: ''
  comment:
    description: comment
    required: false
    default: ''
runs:
  using: composite
  steps:
  - shell: bash
    env:
      GH_TOKEN: ${{ inputs.github-token }}
      INPUT_BRANCH: ${{ inputs.branch }}
      INPUT_BASE: ${{ inputs.base }}
      INPUT_TITLE: ${{ inputs.title }}
      INPUT_BODY: ${{ inputs.body }}
      INPUT_COMMENT: ${{ inputs.comment }}
    run: |
      set -euo pipefail
      pr_number=$(gh pr list --state open --head "$INPUT_BRANCH" --base "$INPUT_BASE" \
        --json number --jq '.[0].number // empty')
      if [ -z "$pr_number" ]; then
        gh pr create --draft --head "$INPUT_BRANCH" --base "$INPUT_BASE" \
          --title "$INPUT_TITLE" --body "$INPUT_BODY"
        pr_number=$(gh pr list --state open --head "$INPUT_BRANCH" --base "$INPUT_BASE" \
          --json number --jq '.[0].number')
      fi
      gh pr comment "$pr_number" --body "$INPUT_COMMENT"
