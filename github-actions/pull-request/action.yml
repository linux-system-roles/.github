# Generated by Codex using model Sol medium 6.
name: Open or update a pull request
description: Create a pull request for the current branch using gh
inputs:
  destination_branch:
    description: Target branch
    required: true
  source_branch:
    description: Source branch
    default: ''
  pr_title:
    description: Pull request title
    default: ''
  pr_body:
    description: Pull request body
    default: ''
  pr_label:
    description: Label to apply
    default: ''
  github_token:
    description: GitHub token
    default: ${{ github.token }}
runs:
  using: composite
  steps:
  - shell: bash
    env:
      GH_TOKEN: ${{ inputs.github_token }}
      INPUT_BASE: ${{ inputs.destination_branch }}
      INPUT_HEAD: ${{ inputs.source_branch }}
      INPUT_TITLE: ${{ inputs.pr_title }}
      INPUT_BODY: ${{ inputs.pr_body }}
      INPUT_LABEL: ${{ inputs.pr_label }}
    run: |
      set -euo pipefail
      head="${INPUT_HEAD:-${GITHUB_REF_NAME:-}}"
      [ -n "$head" ] || { echo 'Source branch is required' >&2; exit 1; }
      number=$(gh pr list --head "$head" --base "$INPUT_BASE" --state open --json number --jq '.[0].number // empty')
      if [ -z "$number" ]; then
        title="${INPUT_TITLE:-$head}"
        body="${INPUT_BODY:-Automated pull request from $head}"
        gh pr create --head "$head" --base "$INPUT_BASE" --title "$title" --body "$body"
        number=$(gh pr list --head "$head" --base "$INPUT_BASE" --state open --json number --jq '.[0].number')
      fi
      if [ -n "$INPUT_LABEL" ]; then gh pr edit "$number" --add-label "$INPUT_LABEL"; fi
